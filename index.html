<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Kanji Map</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="circle-container" id="circleBox">
        <img src="images/doraemon.gif" id="doraemonGif">
    </div>
    <div class="search-container" id="searchContainer">
        <div class="search-box" id="searchBox">
            <div class="search-inner-circle" id="searchInnerCircle">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" id="magnifierIcon">
                    <circle cx="8.5" cy="8.5" r="5"></circle>
                    <line x1="12" y1="12" x2="19" y2="19"></line>
                </svg>
            </div>
            <input type="text" class="search-input" id="searchInput" placeholder="Nhập Kanji cần tra..." maxlength="10">
            <button class="close-btn" id="closeBtn">✕</button>
        </div>
        <div class="vocab-drop-container" id="vocabDropContainer">
            <button class="vocab-btn" id="vocabBtn">Mở rộng từ vựng</button>
            <div class="vocab-list" id="vocabList"></div>
        </div>
    </div>
    <div class="app-title" id="appTitle">T<span id="fallingH" class="falling-h">H</span>E KANJI MAP</div>
        <div class="info-box" id="infoBox">
        <div id="infoContent"></div>
    </div>
    <div id="graph-container"></div>
    <div class="error-modal-overlay" id="errorModalOverlay">
        <div class="error-box" id="errorBox">
            <div class="error-inner-circle" id="errorInnerCircle">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="#D32F2F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" id="errorIcon">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="#2E7D32" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" id="successIcon">
                    <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path>
                </svg>
                <div class="error-title-text" id="errorTitleText">Báo cáo lỗi</div>
            </div>
            <div class="error-content" id="errorContent">
                <div class="error-form-group">
                    <label>Từ khóa bị lỗi (nếu có):</label>
                    <input type="text" id="errorKeyword" readonly style="background-color: #f0f0f0;">
                </div>
                <div class="error-form-group">
                    <label>Vấn đề bạn gặp phải là gì?</label>
                    <select id="errorSelect">
                        <option value="" disabled selected>-- Chọn vấn đề hoặc tự nhập --</option>
                        <option value="Sai nghĩa từ vựng">Sai nghĩa từ vựng</option>
                        <option value="Cách đọc (Onyomi/Kunyomi) bị sai">Cách đọc bị sai</option>
                        <option value="Thiếu từ ghép liên quan">Thiếu từ ghép liên quan</option>
                        <option value="Đồ thị bị lỗi/không bung ra">Đồ thị bị lỗi/không bung ra</option>
                        <option value="Trang web bị giật/lag">Trang web bị giật/lag</option>
                    </select>
                </div>
                <div class="error-form-group">
                    <label>Mô tả chi tiết (không bắt buộc):</label>
                    <textarea id="errorDetails" placeholder="Nhập thêm chi tiết..."></textarea>
                </div>
                <div class="error-modal-actions">
                    <button class="btn-cancel" onclick="closeErrorModal()">Hủy</button>
                    <button class="btn-submit" onclick="submitError()">Gửi</button>
                </div>
            </div>
        </div>
    </div>
    <div id="wordTooltip" class="word-tooltip"></div>
    <div id="visitCounter" class="visit-counter">Lượt truy cập: -- | --</div>
    <div class="hoahiep-container" id="hoahiepContainer">
        <span class="oa-hiep-text" id="oaHiepText">OÀ HIỆP</span>
    </div>
    <img src="images/hand-pick.png" class="grab-hand" id="grabHand">
    <div class="feedback-box" id="feedbackBox">
        <div class="feedback-icon" id="feedbackIcon">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="#555" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
        </div>
        <div class="feedback-success-msg" id="feedbackSuccessMsg">Cảm ơn bạn đã góp ý! ❤️</div>
        <div class="feedback-content" id="feedbackContent">
            <button class="feedback-close-btn" id="feedbackCloseBtn">✕</button>
            <div class="feedback-input-wrapper">
                <textarea id="feedbackInput" placeholder="Quyết tâm đạt JLPT mà không phải lãng phí tiền bạc, hãy cho mình biết các bạn cần gì để mình làm nhé!!"></textarea>
                <button class="feedback-submit-inline" id="feedbackSubmitBtn" title="Gửi">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
